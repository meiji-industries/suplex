[tools]
node = "26.7.0"
"npm:pnpm" = "11.22.0"

[hooks]
postinstall = "pnpm install --frozen-lockfile"

[settings]
experimental = true
activate_aggressive = true

[env]
# Keep Cargo's default per-checkout target; absolute CARGO_TARGET_DIR values
# enter sccache's Rust cache key and prevent dependency reuse across worktrees.
RUSTC_WRAPPER = "{{config_root}}/scripts/sccache-wrapper.sh"
NODE_ENV = "development"
SUPLEX_TAILSCALE_ADDRESS = "{{ exec(command='sh scripts/resolve-magicdns.sh') | trim }}"
SUPLEX_TAILSCALE_EXPOSURE = "serve"
SUPLEX_BIND_ADDRESS = "127.0.0.1"
_.path = "./node_modules/.bin"

[tasks.setup]
description = "Install pinned tools and dependencies for development"
alias = "worktree"
run = "mise install && pnpm exec playwright install chromium"

[tasks.dev]
description = "Run the native supervisor and Vite HMR using the existing Rust development installation"
run = "pnpm run dev"

[tasks."dev:watch"]
description = "Run native Suplex with Rust rebuilds and Vite HMR"
run = "pnpm run dev:watch"

[tasks."dev:rust"]
description = "Alias for the native development stack"
run = "mise run dev"

[tasks."build:rust"]
description = "Build the native binary with frontend assets and migrations"
run = "pnpm run build"

[tasks."test:rust"]
run = '''
cd rust
unset RUSTUP_TOOLCHAIN
RUST_TEST_THREADS=4 cargo test --all-targets
'''

[tasks."test:sccache-wrapper"]
description = "Check compiler-cache forwarding and the fallback without sccache"
run = "sh scripts/test-sccache-wrapper.sh"

[tasks."test:parity"]
run = '''
set -e
pnpm exec tsx scripts/rust-route-coverage.ts
cd rust
unset RUSTUP_TOOLCHAIN
cargo test --test contract_parity --test hash_bytes
cargo test --lib signed_fresh_passkey_survives_reopen_and_updates_counter -- --nocapture
cargo test --lib signed_fresh_passkey_over_isolated_tcp_listener -- --nocapture
'''

[tasks."test:journey:rust"]
description = "Run the deterministic Codex and Claude Code browser journeys, including the local workflow phases, against the Rust backend"
run = '''
set -e
[ -f dist/web/suplex-ui.js ] || pnpm exec vite build
(cd rust && unset RUSTUP_TOOLCHAIN && cargo build --bin suplex --features github-test-endpoint)
export SUPLEX_BIN="${CARGO_TARGET_DIR:-$PWD/rust/target}/debug/suplex"
export SUPLEX_DETERMINISTIC_CODEX_RUN=1
for phase in deliver deliver_pr answer restart cancel deliver_claude direct_build independent_review competing_plans refine_pull_request; do
  SUPLEX_DETERMINISTIC_PHASE=$phase pnpm exec tsx tests/interop/real-codex-standard.ts
done
'''

[tasks."test:interop:rust"]
description = "Run the Rust interop scripts other than the Codex journey"
run = '''
set -e
[ -f dist/web/suplex-ui.js ] || pnpm exec vite build
(cd rust && unset RUSTUP_TOOLCHAIN && cargo build --bin suplex --features github-test-endpoint)
export SUPLEX_BIN="${CARGO_TARGET_DIR:-$PWD/rust/target}/debug/suplex"
for script in root-delivery-inspection root-image root-worker-evidence root-worker-replacement task-timeline; do
  echo "[interop] $script" >&2
  pnpm exec tsx --import ./tests/helpers/interop-deadline.ts tests/interop/$script.ts
done
'''

[tasks.down]
description = "Stop this checkout's owned native development processes"
run = "pnpm exec tsx scripts/dev.ts --stop"

[tasks."dev:status"]
run = '''
port=${SUPLEX_PORT:-${CONDUCTOR_PORT:-14111}}
lsof -nP -iTCP:$port -sTCP:LISTEN || echo "dev stack not running (port $port free)"
'''

[tasks."dev:recover"]
description = "Stop owned native development processes, escalating if needed"
run = "pnpm exec tsx scripts/dev.ts --stop"

[tasks."db:migrate"]
run = "pnpm exec tsx scripts/dev.ts --migrate"
[tasks.build]
run = "pnpm run build"
[tasks.typecheck]
run = "export PATH=\"$(dirname \"$(mise which node)\"):$PATH\" && pnpm run typecheck"
[tasks.lint]
run = "export PATH=\"$(dirname \"$(mise which node)\"):$PATH\" && pnpm run lint && cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings"
[tasks.test]
run = "export PATH=\"$(dirname \"$(mise which node)\"):$PATH\" && pnpm run test"
[tasks.test-browser]
run = "export PATH=\"$(dirname \"$(mise which node)\"):$PATH\" && pnpm run test:browser"

[tasks."desktop:dev"]
description = "Build the desktop app and open it with Electron"
run = "pnpm run desktop:dev"
[tasks."desktop:build"]
description = "Compile the desktop app"
run = "pnpm run desktop:build"
[tasks."desktop:typecheck"]
run = "pnpm run desktop:typecheck"
[tasks."desktop:test"]
run = "pnpm run desktop:test"
[tasks."desktop:dist"]
description = "Bundle the server runtime, then package Suplex.app, DMG, and ZIP under desktop/release/<arch> (SUPLEX_DESKTOP_ARCH=arm64 or x64, default arm64; Developer ID signed if the cert is in the keychain, not notarized)"
run = "pnpm run desktop:dist"
[tasks."desktop:install"]
description = "Build Suplex.app from this checkout and replace /Applications/Suplex.app without a release: quit, swap, relaunch, then suplex doctor (refuses uncommitted changes unless SUPLEX_INSTALL_DIRTY=1)"
run = "sh scripts/desktop-install.sh"
[tasks."desktop:dist:signed"]
description = "Bundle the server runtime, then package, sign, notarize, and staple the Apple silicon and Intel DMGs for distribution; Apple credentials come from the 1Password Suplex vault (.env.production)"
run = '''
source scripts/onepassword.sh
onepassword_setup_service_account
for arch in arm64 x64; do
  SUPLEX_DESKTOP_ARCH=$arch pnpm run desktop:dist:signed
done
shasum -a 256 desktop/release/*/Suplex-*.dmg
'''
[tasks."_1password:setup"]
hide = true
description = "Fetch or verify the Suplex 1Password service account"
run = '''
source scripts/onepassword.sh
onepassword_setup_service_account
'''
[tasks."desktop:publish"]
description = "Publish the signed desktop release with R2 credentials from 1Password"
run = '''
source scripts/onepassword.sh
onepassword_setup_service_account
for arch in arm64 x64; do
  SUPLEX_DESKTOP_ARCH=$arch op run --env-file desktop/release.env -- pnpm run desktop:publish
done
'''
[tasks."linux:dist"]
description = "Build the Linux suplex binary in Docker for arm64 and x64 and pack each under dist/linux/<arch>"
run = '''
for arch in arm64 x64; do
  SUPLEX_LINUX_ARCH=$arch sh scripts/build-linux.sh
done
'''
[tasks."linux:publish"]
description = "Publish the Linux suplex tarballs from dist/linux with R2 credentials from 1Password"
run = '''
source scripts/onepassword.sh
onepassword_setup_service_account
for arch in arm64 x64; do
  SUPLEX_LINUX_ARCH=$arch op run --env-file desktop/release.env -- bash scripts/publish-linux-release.sh
done
'''
[tasks."_release:publish"]
hide = true
description = "Upload the Mac and Linux files for both architectures, then point all four download feeds at the new version"
run = '''
source scripts/onepassword.sh
onepassword_setup_service_account
# Every file is uploaded before any feed changes, so a failed upload leaves the previous release live on all platforms.
for phase in files manifest; do
  for arch in arm64 x64; do
    SUPLEX_PUBLISH_PHASE=$phase SUPLEX_DESKTOP_ARCH=$arch op run --env-file desktop/release.env -- pnpm run desktop:publish
    SUPLEX_PUBLISH_PHASE=$phase SUPLEX_LINUX_ARCH=$arch op run --env-file desktop/release.env -- bash scripts/publish-linux-release.sh
  done
done
'''
[tasks."_release:bump"]
hide = true
run = '''
# Uncommitted version files, or HEAD already tagged with this version, mean an earlier release run failed; resume that version.
version="$(node -p "require('./package.json').version")"
if [[ "$(git rev-parse -q --verify "refs/tags/v$version^{commit}")" == "$(git rev-parse HEAD)" ]]; then
  echo "Resuming release v$version (already tagged)"
elif ! git diff --quiet -- package.json desktop/package.json rust/Cargo.toml rust/Cargo.lock; then
  node scripts/release-version.mjs check-tag
  echo "Resuming release v$version"
else
  node scripts/release-version.mjs bump
fi
'''
[tasks."_release:check"]
hide = true
description = "Verify the checkout and Docker are ready for a desktop and Linux release"
run = '''
git --no-pager diff --check
# Version files may be dirty from an earlier failed run; _release:bump resumes that version.
[[ -z "$(git status --porcelain -- . ':!package.json' ':!desktop/package.json' ':!rust/Cargo.toml' ':!rust/Cargo.lock')" ]] || { echo "Commit or remove working-tree changes before releasing." >&2; exit 1; }
docker info >/dev/null 2>&1 || { echo "Start Docker before releasing; the Linux build runs in Docker." >&2; exit 1; }
node --input-type=module <<'NODE'
import { readFileSync } from "node:fs";
const version = JSON.parse(readFileSync("package.json", "utf8")).version;
const desktop = JSON.parse(readFileSync("desktop/package.json", "utf8")).version;
const native = ["rust/Cargo.toml", "rust/Cargo.lock"].every(file => readFileSync(file, "utf8").includes(`name = "suplex"\nversion = "${version}"`));
if (desktop !== version || !native) throw new Error("Desktop, frontend, and native versions must match before release.");
NODE
'''
[tasks."_release:commit"]
hide = true
description = "Commit, tag, and push the released desktop version"
run = '''
version="$(node -p "require('./package.json').version")"
# A rerun after a failed publish finds the tag on HEAD already; only push again.
if [[ "$(git rev-parse -q --verify "refs/tags/v$version^{commit}")" != "$(git rev-parse HEAD)" ]]; then
  node scripts/release-version.mjs check-tag
  git add package.json desktop/package.json rust/Cargo.toml rust/Cargo.lock
  git commit -m "release: v$version"
  git tag "v$version"
fi
git push --atomic origin HEAD "refs/tags/v$version"
'''
[tasks."_release:run"]
hide = true
description = "Run the desktop and Linux release pipeline"
run = "mise run _release:check && mise run _1password:setup && mise run _release:bump && mise run desktop:dist:signed && mise run linux:dist && mise run _release:commit && mise run _release:publish"
[tasks."release:major"]
description = "Bump, sign, notarize, commit, tag, push, and publish the next major desktop and Linux release"
run = "RELEASE_BUMP=major mise run _release:run"
[tasks."release:minor"]
description = "Bump, sign, notarize, commit, tag, push, and publish the next minor desktop and Linux release"
run = "RELEASE_BUMP=minor mise run _release:run"
[tasks."release:patch"]
description = "Bump, sign, notarize, commit, tag, push, and publish the next patch desktop and Linux release"
run = "RELEASE_BUMP=patch mise run _release:run"
[tasks."desktop:open"]
description = "Open the installed Suplex.app at this checkout's native development stack"
run = "pnpm exec tsx scripts/dev.ts --desktop"
[tasks."desktop:pages"]
description = "Serve the desktop setup pages for browser preview"
run = '''
echo "Preview: http://localhost:8123/install.html and http://localhost:8123/choice.html"
exec python3 -m http.server 8123 --directory desktop/src/pages
'''
