<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge</title>
<style>
  body { margin: 0; -webkit-app-region: drag; min-height: 100vh; display: grid; place-items: center; background: #0a0a0a; color: #e5e5e5; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  form { display: grid; gap: 8px; width: min(420px, 90vw); }
  input, button { font: inherit; height: 28px; padding: 0 8px; border-radius: 5px; border: 1px solid #333; background: #141414; color: inherit; }
  input, button { -webkit-app-region: no-drag; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  button.primary { background: #e5e5e5; border-color: #e5e5e5; color: #171717; }
  button.primary:disabled { background: #404040; border-color: #404040; color: #a3a3a3; }
  #status { margin: 0; min-height: 18px; color: #a3a3a3; font-size: 12px; }
  #back { display: none; border: 0; background: none; color: #a3a3a3; justify-self: start; padding: 0; height: 18px; }
</style>
</head>
<body>
<form method="get">
  <label for="url">Forge URL</label>
  <input id="url" name="url" type="url" required autofocus value="http://localhost:4111" placeholder="https://forge.<tailnet>.ts.net">
  <div class="row"><button id="test" type="button">Test connection</button><button id="save" class="primary" type="submit" disabled>Save</button></div>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="back" type="button">Back</button>
</form>
<script>
  const url = document.getElementById("url");
  const test = document.getElementById("test");
  const save = document.getElementById("save");
  const status = document.getElementById("status");
  let proven = "";
  url.addEventListener("input", () => { save.disabled = url.value.trim() !== proven; status.textContent = ""; });
  test.addEventListener("click", async () => {
    const candidate = url.value.trim();
    test.disabled = true;
    status.textContent = "Testing…";
    const result = await window.forgeDesktop.testConnection(candidate);
    test.disabled = false;
    if (result.ok) { proven = candidate; save.disabled = false; status.textContent = "Forge answered."; save.focus(); }
    else { proven = ""; save.disabled = true; status.textContent = result.reason ?? "No Forge answered at that URL."; }
  });
  document.getElementById("back").addEventListener("click", () => window.forgeDesktop.back());
  window.forgeDesktop.snapshot().then((snapshot) => {
    if (snapshot.state === "connecting-remote") document.getElementById("back").style.display = "block";
  });
</script>
</body>
</html>
