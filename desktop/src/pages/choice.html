<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up Suplex</title>
<link rel="stylesheet" href="pages.css">
<style>
  .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 20px; }
  .card { display: grid; gap: 8px; align-content: start; width: 176px; aspect-ratio: 1; overflow: hidden; padding: 16px; border: 1px solid #303030; border-radius: 8px; background: #141414; cursor: pointer; }
  .card:hover { border-color: #404040; }
  .card:has(input:checked) { border-color: #e5e5e5; background: #171717; }
  .card:focus-within { outline: none; }
  .card:has(input:focus-visible) { outline: 2px solid #a3a3a3; outline-offset: 3px; }
  .card input { -webkit-appearance: none; appearance: none; position: absolute; opacity: 0; }
  .card svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card strong { font-size: 13px; font-weight: 600; }
  /* The form is as wide as the row of cards, so the sections below line up with their edges. The sections add no width of their own. */
  #modes { width: fit-content; max-width: 100%; margin: 0 auto; }
  #remote, #tailscale-section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin: 20px 0 0; padding: 0; border: 0; min-width: 0; contain: inline-size; }
  #remote[disabled] { display: none; }
  /* Match the app's InputGroup while keeping the native protocol and port controls. */
  .input-group { position: relative; display: flex; align-items: center; height: 36px; border: 1px solid oklch(1 0 0 / 15%); border-radius: 9999px; background: oklch(1 0 0 / 4.5%); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); transition: border-color 150ms, box-shadow 150ms; }
  .input-group:has(:focus-visible) { border-color: oklch(0.556 0 0); box-shadow: 0 0 0 3px oklch(0.556 0 0 / 50%); }
  .input-group input, .input-group select { font: 14px/1.5 -apple-system, system-ui, sans-serif; height: 100%; min-width: 0; padding: 0 8px; border: 0; background: none; color: inherit; outline: none; }
  .input-group input::placeholder { color: oklch(0.708 0 0); }
  .input-group select { padding-right: 4px; color: #a3a3a3; cursor: pointer; }
  .input-group > span { color: #737373; }
  #host, #machine { flex: 1; }
  #port { width: 64px; }
  /* Styled like shadcn's Select. A trigger and a listbox built by hand, because WKWebView has no customizable <select>. */
  #machine { gap: 8px; justify-content: flex-start; min-width: 0; height: 100%; min-height: 0; padding: 0 10px 0 8px; border: 0; border-radius: 0; background: none; color: inherit; font-size: 14px; text-align: left; outline: none; }
  #machine:hover:not(:disabled) { background: none; }
  #machine[hidden] { display: none; }
  #machine .m-value { display: flex; flex: 1; align-items: center; gap: 8px; min-width: 0; overflow: hidden; white-space: nowrap; }
  #machine .m-value:empty::before { content: "Select a machine"; color: #737373; }
  #machine svg { flex: none; width: 16px; height: 16px; fill: none; stroke: #737373; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* The list hangs below the whole input group. Nothing above it clips overflow: `contain: inline-size` does not. */
  #machines { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 1; padding: 4px; max-height: 280px; overflow-y: auto; border: 1px solid #303030; border-radius: 8px; background: #141414; color: #e5e5e5; box-shadow: 0 8px 24px rgb(0 0 0 / 0.45); }
  #machines[hidden] { display: none; }
  #machines [role="option"] { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 8px; border-radius: 5px; font-size: 13px; cursor: pointer; outline: none; }
  #machines [role="option"]:focus { background: #262626; }
  #machines [role="option"]::after { content: "✓"; color: #a3a3a3; visibility: hidden; }
  #machines [aria-selected="true"]::after { visibility: visible; }
  .m-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: #737373; }
  .m-dot[data-state="found"] { background: #22c55e; animation: pulse 1.6s ease-out infinite; }
  .m-dot[data-state="offline"] { background: none; box-shadow: inset 0 0 0 1px #525252; }
  .m-host { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #737373; font-size: 12px; }
  .m-meta { color: #a3a3a3; font-size: 12px; }
  .m-name { color: #e5e5e5; }
  .m-dot[data-state="offline"] + .m-name { color: #737373; }
  .tailscale-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
  .tailscale-row > button { flex: none; white-space: nowrap; }
  #tailscale { display: flex; gap: 6px; }
  #tailscale::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 6px; border-radius: 50%; background: #737373; }
  #tailscale[data-state="on"]::before { background: #22c55e; }
  #tailscale-section:has(#tailscale:empty), #tailscale-action[hidden] { display: none; }
  #remote .row { display: flex; align-items: center; gap: 8px; }
  #remote .row .input-group { flex: 1; min-width: 0; }
  #test { min-height: 32px; }
  #status:empty { display: none; }
  #scan { gap: 8px; }
  #scan .spinner { width: 12px; height: 12px; border: 1.5px solid #404040; border-top-color: #e5e5e5; border-radius: 50%; animation: spin 700ms linear infinite; }
  #scan[hidden], #scan .spinner[hidden] { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #where { margin-bottom: 32px; text-align: center; font-size: 36px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; }
  main { justify-self: stretch; width: auto; margin: 0 24px; }
  .instance .where { display: flex; align-items: center; min-width: 0; }
  .instance .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .instance .where + p { margin-top: -6px; }
  .saved { position: relative; }
  .saved .select { display: grid; gap: 8px; align-content: start; width: 100%; height: 100%; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
  .saved .select:hover { background: none; }
  .saved strong { max-height: 2.6em; overflow: hidden; overflow-wrap: anywhere; line-height: 1.3; }
  .saved p { color: #a3a3a3; font-size: 12px; }
  .saved .delete { position: absolute; right: 10px; bottom: 10px; padding: 4px; border: 0; background: none; color: #a3a3a3; font-size: 12px; }
  .saved .delete:hover { background: none; color: #e5e5e5; }
  .live { flex: none; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: #22c55e; animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 rgb(34 197 94 / 0.6); } to { box-shadow: 0 0 0 6px rgb(34 197 94 / 0); } }
  @media (prefers-reduced-motion: reduce) { .live { animation: none; } }
  body { display: grid; place-items: center; }
  h1 { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
  h1 img { width: 88px; height: auto; }
  .actions { flex-direction: column; }
  #continue { align-self: stretch; min-height: 36px; border: 0; border-radius: 9999px; background: oklch(0.938 0.172 121.709); color: oklch(0.205 0 0); font-size: 14px; font-weight: 500; }
  #continue:hover:not(:disabled) { background: color-mix(in oklch, oklch(0.938 0.172 121.709) 80%, transparent); }
  #test, #scan, #tailscale-action { min-height: 32px; padding: 0 10px; border-radius: 9999px; border-color: oklch(1 0 0 / 15%); background: oklch(1 0 0 / 4.5%); font-size: 14px; font-weight: 500; }
  #test:hover:not(:disabled), #scan:hover:not(:disabled), #tailscale-action:hover:not(:disabled) { background: oklch(1 0 0 / 7.5%); }
  #continue:active:not(:disabled), #test:active:not(:disabled), #scan:active:not(:disabled), #tailscale-action:active:not(:disabled) { transform: translateY(1px); }
  /* Intro: a large wordmark fades in, moves into the header wordmark, then the page appears. */
  #intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; pointer-events: none; }
  #intro img { width: min(360px, 60vw); height: auto; opacity: 0; }
  html:not(.intro) #intro { display: none; }
  html.intro main, html.intro h1 img { visibility: hidden; }
</style>
<script>
  // Play the intro unless the viewer asks the system for less motion.
  if (!location.search.includes("manage=1") && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("intro");
</script>
</head>
<body data-tauri-drag-region="deep">
<div id="intro" aria-hidden="true"><img src="wordmark.svg" alt=""></div>
<main>
  <h1><img src="wordmark.svg" alt="Suplex"></h1>
  <h2 id="where">Where do you work?</h2>
  <form id="modes" method="get" aria-labelledby="where">
    <template id="instance"><label class="card instance"><input type="radio" name="mode" value="instance"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg><strong></strong><p class="where"><span class="live" aria-hidden="true"></span><span class="host"></span></p><p>is running Suplex</p></label></template>
    <div class="cards" id="cards">
      <label class="card"><input type="radio" name="mode" value="local"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z"/><path d="M20.054 15.987H3.946"/></svg><strong>Run locally</strong><p>Work directly in the app, or leave it running so other devices can connect remotely.</p></label>
      <label class="card"><input type="radio" name="mode" value="remote"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></svg><strong>Remote access</strong><p>Connect to Suplex on another machine in your tailnet. All tasks run on that machine.</p></label>
    </div>
    <fieldset id="remote" disabled>
      <label id="url-label" for="host">Suplex URL</label>
      <div class="row">
        <div class="input-group" role="group" data-tauri-drag-region="false">
          <select id="protocol" aria-label="Protocol"><option value="tailscale" disabled>Tailscale</option><option value="https" selected>https://</option><option value="http">http://</option></select>
          <button id="machine" type="button" role="combobox" aria-label="Tailnet machine" aria-haspopup="listbox" aria-controls="machines" aria-expanded="false" hidden disabled><span class="m-value"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <div id="machines" role="listbox" aria-label="Tailnet machine" hidden></div>
          <input id="host" type="text" required placeholder="suplex.tailnet.ts.net" autocomplete="off" spellcheck="false">
          <span aria-hidden="true">:</span>
          <input id="port" type="text" inputmode="numeric" pattern="[0-9]{1,5}" value="4111" placeholder="port" aria-label="Port">
        </div>
        <button id="test" type="button">Test</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </fieldset>
    <div id="tailscale-section">
      <div class="tailscale-row"><p id="tailscale" role="status"></p><button id="tailscale-action" type="button" hidden></button><button id="scan" type="button" hidden><span class="spinner" aria-hidden="true" hidden></span><span id="scan-label">Rescan Tailnet</span></button></div>
    </div>
    <input id="url" name="url" type="hidden">
    <div class="actions"><button class="primary" id="continue" type="submit">Continue</button></div>
  </form>
</main>
<script>
  const modes = document.getElementById("modes");
  const remote = document.getElementById("remote");
  const url = document.getElementById("url");
  const protocol = document.getElementById("protocol");
  const host = document.getElementById("host");
  const port = document.getElementById("port");
  const machine = document.getElementById("machine");
  const machineList = document.getElementById("machines");
  // Tailscale is https:// to a machine's MagicDNS name, where `tailscale serve` publishes Suplex.
  const tailnet = () => protocol.value === "tailscale";
  const address = () => {
    const name = tailnet() ? machine.value : host.value.trim();
    const number = port.value.trim();
    return name ? `${tailnet() ? "https" : protocol.value}://${name}${number ? `:${number}` : ""}` : "";
  };
  const test = document.getElementById("test");
  const status = document.getElementById("status");
  const next = document.getElementById("continue");
  const cards = document.getElementById("cards");
  const refreshHosts = async () => {
    const snapshot = await window.suplexDesktop.snapshot();
    for (const card of cards.querySelectorAll(".saved")) card.remove();
    for (const origin of snapshot.hosts) {
      const target = new URL(origin);
      const card = document.createElement("div");
      card.className = "card saved";
      const select = document.createElement("button");
      select.className = "select";
      select.type = "button";
      select.setAttribute("aria-label", `Open ${target.host}`);
      select.title = origin;
      select.addEventListener("click", () => { void window.suplexDesktop.selectHost(origin); });
      const icon = document.getElementById("instance").content.querySelector("svg").cloneNode(true);
      const name = document.createElement("strong");
      name.textContent = target.hostname;
      const detail = document.createElement("p");
      detail.textContent = `${origin === snapshot.currentHost ? "Current host" : "Saved host"}${target.port ? ` · ${target.port}` : ""}`;
      select.append(icon, name, detail);
      const remove = document.createElement("button");
      remove.className = "delete";
      remove.type = "button";
      remove.textContent = "Delete";
      remove.setAttribute("aria-label", `Delete ${target.host} from saved hosts`);
      remove.addEventListener("click", async () => { await window.suplexDesktop.removeHost(origin); await refreshHosts(); });
      card.append(select, remove);
      cards.insertBefore(card, cards.querySelector(".instance, label"));
    }
  };
  void refreshHosts();
  const selected = () => modes.querySelector('input[name="mode"]:checked');
  const chosen = () => selected()?.value ?? null;
  let proven = "";
  const sync = () => {
    remote.disabled = chosen() !== "remote";
    host.hidden = host.disabled = tailnet();
    machine.hidden = machine.disabled = !tailnet();
    document.getElementById("url-label").htmlFor = tailnet() ? "machine" : "host";
    // A found instance answered its probe already, so it needs no second test.
    url.value = chosen() === "instance" ? selected().dataset.url : address();
    next.disabled = chosen() === null || (chosen() === "remote" && (url.value === "" || url.value !== proven));
  };
  modes.addEventListener("change", (event) => {
    sync();
    if (event.target.name === "mode" && !remote.disabled) (tailnet() ? machine : host).focus();
  });
  remote.addEventListener("input", () => {
    // A pasted full URL fills all three fields.
    if (host.value.includes("://")) {
      try {
        const pasted = new URL(host.value.trim());
        if (pasted.protocol === "https:" || pasted.protocol === "http:") protocol.value = pasted.protocol.slice(0, -1);
        host.value = pasted.hostname;
        port.value = pasted.port;
      } catch { /* leave it for the connection test to report */ }
    }
    status.textContent = "";
    sync();
  });
  test.addEventListener("click", async () => {
    const candidate = address();
    if (!candidate) { status.textContent = tailnet() ? "Select a machine." : "Enter a hostname."; (tailnet() ? machine : host).focus(); return; }
    test.disabled = true;
    status.textContent = "Testing…";
    const result = await window.suplexDesktop.testConnection(candidate);
    test.disabled = false;
    proven = result.ok ? candidate : "";
    status.textContent = result.ok ? "Suplex answered." : result.reason ?? "No Suplex answered at that URL.";
    sync();
    if (result.ok) next.focus();
  });
  // One row per machine: status dot, name, MagicDNS host, and what Suplex knows about it.
  const machineRow = (each) => {
    const row = document.createElement("div");
    row.setAttribute("role", "option");
    row.tabIndex = -1;
    row.dataset.value = each.host;
    for (const [name, text] of [["m-dot", ""], ["m-name", each.name], ["m-host", each.host], ["m-meta", each.online ? "" : "Offline"]]) {
      const part = document.createElement("span");
      part.className = name;
      part.textContent = text;
      row.append(part);
    }
    row.querySelector(".m-dot").dataset.state = each.online ? "online" : "offline";
    return row;
  };
  // Select a row and show its dot, name, and host in the trigger. A value with no row selects nothing, as in a <select>.
  const pick = (value) => {
    const row = [...machineList.children].find((each) => each.dataset.value === value);
    machine.value = row ? value : "";
    for (const each of machineList.children) each.setAttribute("aria-selected", String(each === row));
    machine.querySelector(".m-value").replaceChildren(...(row ? [...row.querySelectorAll(".m-dot, .m-name, .m-host")].map((part) => part.cloneNode(true)) : []));
  };
  const open = () => {
    machineList.hidden = false;
    machine.setAttribute("aria-expanded", "true");
    (machineList.querySelector('[aria-selected="true"]') ?? machineList.firstElementChild)?.focus();
  };
  const close = () => {
    machineList.hidden = true;
    machine.setAttribute("aria-expanded", "false");
  };
  // A new machine is tested at once.
  const choose = (row) => {
    close();
    machine.focus();
    if (row.dataset.value === machine.value) return;
    pick(row.dataset.value);
    status.textContent = "";
    sync();
    test.click();
  };
  machine.addEventListener("click", () => (machineList.hidden ? open() : close()));
  machine.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
    event.preventDefault();
    open();
  });
  machineList.addEventListener("click", (event) => {
    const row = event.target.closest('[role="option"]');
    if (row) choose(row);
  });
  machineList.addEventListener("pointermove", (event) => event.target.closest('[role="option"]')?.focus({ preventScroll: true }));
  machineList.addEventListener("keydown", (event) => {
    const rows = [...machineList.children];
    const at = rows.indexOf(document.activeElement);
    const to = { ArrowDown: Math.min(at + 1, rows.length - 1), ArrowUp: Math.max(at - 1, 0), Home: 0, End: rows.length - 1 }[event.key];
    if (to !== undefined) rows[to]?.focus();
    else if (event.key === "Enter" && at >= 0) choose(rows[at]);
    else if (event.key === "Escape") { close(); machine.focus(); }
    else if (event.key === "Tab") { close(); return; }
    else return;
    event.preventDefault();
  });
  document.addEventListener("pointerdown", (event) => {
    if (!machine.contains(event.target) && !machineList.contains(event.target)) close();
  });
  const scanButton = document.getElementById("scan");
  const indicator = document.getElementById("tailscale");
  const action = document.getElementById("tailscale-action");
  // One line for each Tailscale state, and the one action that moves it toward on.
  const describe = ({ state, tailnet }) => {
    switch (state) {
      case "missing": return ["Tailscale is not installed on this Mac.", "Open the download page"];
      case "not-running": return ["The Tailscale app is closed.", "Open Tailscale"];
      case "signed-out": return ["You are not signed in to Tailscale.", "Sign in"];
      case "approval": return ["An admin must approve this Mac in your tailnet.", "Open Tailscale"];
      case "off": return [`Tailscale is off.${tailnet ? ` Tailnet: ${tailnet}.` : ""}`, "Start Tailscale"];
      case "starting": return ["Tailscale connects to your tailnet.", ""];
      default: return [tailnet ? `Tailnet: ${tailnet}` : "Tailscale is on.", ""];
    }
  };
  let tailscale = null;
  const show = (status) => {
    tailscale = status;
    const [text, label] = describe(status);
    indicator.dataset.state = status.state;
    indicator.textContent = text;
    action.textContent = label;
    action.hidden = !label;
    // A scan finds nothing unless Tailscale is on.
    scanButton.hidden = status.state !== "on";
  };
  // Find the tailnet machines, then probe every online one where `tailscale serve` publishes Suplex, and offer the ones that answer.
  const scan = async () => {
    scanButton.disabled = true;
    scanButton.querySelector(".spinner").hidden = false;
    document.getElementById("scan-label").textContent = "Scanning Tailnet";
    try {
      const status = await window.suplexDesktop.tailscaleStatus();
      const machines = status.machines;
      const kept = chosen() === "instance" ? selected().dataset.url : null;
      const picked = machine.value;
      machineList.replaceChildren();
      for (const card of cards.querySelectorAll(".instance")) card.remove();
      show(status);
      protocol.options[0].disabled = !machines.length;
      if (!machines.length) {
        if (tailnet()) protocol.value = "https";
      } else {
        for (const each of machines) machineList.append(machineRow(each));
        pick(picked);
        if (!host.value.trim()) protocol.value = "tailscale";
        const online = machines.filter((each) => each.online);
        const answered = await Promise.all(online.map(async (each) => (await window.suplexDesktop.testConnection(`https://${each.host}:4111`)).ok));
        const found = online.filter((_, index) => answered[index]);
        const template = document.getElementById("instance");
        // Machines that run Suplex go first, above the other online machines and then the offline ones.
        for (const [index, each] of found.entries()) {
          const row = [...machineList.children].find((candidate) => candidate.dataset.value === each.host);
          if (row) {
            row.querySelector(".m-dot").dataset.state = "found";
            row.querySelector(".m-meta").textContent = "Suplex";
            machineList.insertBefore(row, machineList.children[index]);
          }
          const card = template.content.firstElementChild.cloneNode(true);
          const input = card.querySelector("input");
          input.dataset.url = `https://${each.host}:4111`;
          input.checked = input.dataset.url === kept;
          card.querySelector("strong").textContent = each.name;
          card.querySelector(".host").textContent = card.querySelector(".host").title = `${each.host}:4111`;
          cards.insertBefore(card, cards.querySelector("label:not(.instance)"));
        }
      }
      // Keep a machine chosen during the probes, and show a found dot in the trigger.
      pick(machine.value);
      sync();
    } finally {
      scanButton.disabled = false;
      scanButton.querySelector(".spinner").hidden = true;
      document.getElementById("scan-label").textContent = "Rescan Tailnet";
    }
  };
  scanButton.addEventListener("click", () => { void scan(); });
  action.addEventListener("click", async () => {
    if (tailscale.state === "missing") { window.open("https://tailscale.com/download/mac"); return; }
    if (tailscale.state !== "off") { await window.suplexDesktop.openTailscale(); return; }
    action.disabled = true;
    const reason = await window.suplexDesktop.turnOnTailscale();
    action.disabled = false;
    await scan();
    if (reason && tailscale.state === "off") indicator.textContent = reason;
  });
  // Follow changes made in the Tailscale app, such as a sign-in, without a manual scan.
  setInterval(async () => {
    if (scanButton.disabled) return;
    if ((await window.suplexDesktop.tailscaleStatus()).state !== tailscale?.state) void scan();
  }, 3000);
  sync();
  void scan();
  const intro = async () => {
    const big = document.querySelector("#intro img");
    const small = document.querySelector("h1 img");
    await big.decode().catch(() => undefined);
    await big.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 800, easing: "ease-out", fill: "forwards" }).finished;
    await new Promise((resolve) => setTimeout(resolve, 1100));
    const from = big.getBoundingClientRect();
    const to = small.getBoundingClientRect();
    const move = `translate(${to.left + to.width / 2 - (from.left + from.width / 2)}px, ${to.top + to.height / 2 - (from.top + from.height / 2)}px) scale(${to.width / from.width})`;
    await big.animate([{ transform: "none" }, { transform: move }], { duration: 800, easing: "cubic-bezier(0.65, 0, 0.35, 1)", fill: "forwards" }).finished;
    document.documentElement.classList.remove("intro");
  };
  if (document.documentElement.classList.contains("intro")) void intro();
  // Local starts the install; an instance or a remote URL submits ?url=… and the main process connects to it.
  modes.addEventListener("submit", (event) => {
    if (chosen() !== "local" && chosen() !== null) return;
    event.preventDefault();
    if (chosen() === null) return;
    next.disabled = true;
    window.suplexDesktop.choose("local");
  });
  modes.addEventListener("dblclick", (event) => { if (event.target.closest(".card") && chosen() !== "remote") modes.requestSubmit(); });
</script>
</body>
</html>
