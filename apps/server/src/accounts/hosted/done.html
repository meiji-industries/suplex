<div class="stack center">
  <h1>You are logged in</h1>
  <p>Return to Suplex to continue. You can close this tab.</p>
</div>
<a class="button primary" href="suplex://auth/done">Open Suplex</a>
    <script>
      // A login that started in a web browser continues in the Suplex tab that opened this one.
      if (new URLSearchParams(location.search).get("client") === "web") {
        document.querySelector("a").remove();
        document.querySelector("p").textContent = "Suplex continues in the other tab. If this tab stays open, close it.";
        // Suplex closes this tab when it sees the login. This is a backup; the browser can refuse it.
        window.close();
      } else location.replace("suplex://auth/done");
    </script>
