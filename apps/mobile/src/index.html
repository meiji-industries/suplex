<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suplex</title>
<link rel="stylesheet" href="picker.css">
</head>
<body>
<main>
  <form id="picker" novalidate>
    <header>
      <img class="mark" src="wordmark.svg" alt="Suplex">
      <h1>Connect to your host.</h1>
      <p class="lede">Enter the address of the Mac running Suplex.</p>
    </header>
    <p class="eyebrow">Suplex host</p>
    <div class="field">
      <label for="host">Host address</label>
      <div class="input-group"><input id="host" name="host" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://studio.tail1234.ts.net" required></div>
    </div>
    <p class="hint">Your phone needs to reach this Mac. If it uses Tailscale, turn on Tailscale on this phone first.</p>
    <p id="error" role="alert"></p>
    <button id="connect" class="primary" type="submit">Continue</button>
  </form>
</main>
<script src="picker.js"></script>
</body>
</html>
