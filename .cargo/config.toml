# ts-rs export settings. The root location applies wherever cargo runs in
# the workspace (the repository root or a member directory such as apps/server/).
[env]
TS_RS_EXPORT_DIR = { value = "apps/web/contracts/generated", relative = true }
TS_RS_LARGE_INT = "number"
TS_RS_IMPORT_EXTENSION = "js"

# Inside a Suplex Worker, tests and `cargo run` get the real Git instead of
# the Worker Git guard. See scripts/cargo-runner.sh.
[target.'cfg(unix)']
runner = "scripts/cargo-runner.sh"
