<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installing Suplex</title>
<link rel="stylesheet" href="pages.css">
<style>
  .bar { margin-top: 12px; height: 4px; border-radius: 2px; background: #262626; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: #e5e5e5; transition: width 200ms linear; }
  ol { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 8px; }
  li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 10px; color: #737373; }
  li.done, li.running { color: #e5e5e5; }
  li time { color: #737373; font-size: 11px; font-variant-numeric: tabular-nums; }
  .mark { display: grid; place-items: center; width: 16px; height: 16px; }
  .mark::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #404040; }
  li.done .mark::before { content: "✓"; width: auto; height: auto; background: none; color: #4ade80; font-size: 12px; }
  li.running .mark::before { width: 12px; height: 12px; border: 1.5px solid #404040; border-top-color: #e5e5e5; border-radius: 50%; background: none; animation: spin 700ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  body { display: grid; place-items: center; }
  h1 { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
  h1 img { width: 88px; height: auto; }
  main { justify-self: stretch; width: auto; margin: 0 24px; }
  #stage { margin-bottom: 8px; text-align: center; font-size: 36px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; }
  #count { text-align: center; }
  .progress { width: min(100%, 584px); margin: 20px auto 0; }
  .actions { justify-content: center; }
  #demo-toggle { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; }
  #demo-toggle[hidden] { display: none; }
  #demo-toggle a { color: #525252; font-size: 11px; text-decoration: none; }
  #demo-toggle a:hover { color: #a3a3a3; text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1><img src="wordmark.svg" alt="Suplex"></h1>
  <h2 id="stage">Setting you up…</h2>
  <p id="count"></p>
  <div class="progress">
  <div class="bar"><div id="fill"></div></div>
  <ol id="steps"></ol>
  <details class="log"><summary>Show log</summary><pre id="log"></pre></details>
  </div>
  <div class="actions"><button id="cancel" type="button">Cancel</button></div>
</main>
<p id="demo-toggle" hidden><a href="?demo">Show demo steps</a></p>
<script>
  const LOG_LINES = 500;
  const state = { stages: [], finished: new Map(), current: null, log: [] };
  const elapsed = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}`;

  function render() {
    const total = state.stages.length;
    const done = state.finished.size;
    const running = state.stages.find((stage) => stage.name === state.current);
    document.getElementById("stage").textContent = running ? running.title : done === total && total > 0 ? "Finishing" : "Setting you up…";
    document.getElementById("count").textContent = total === 0 ? "" : `${Math.min(done + (running ? 1 : 0), total)} of ${total} steps`;
    document.getElementById("fill").style.width = total === 0 ? "0%" : `${((done + (running ? 0.5 : 0)) / total) * 100}%`;
    const steps = document.getElementById("steps");
    steps.replaceChildren(...state.stages.map((stage) => {
      const finished = state.finished.get(stage.name);
      const row = document.createElement("li");
      row.className = finished ? "done" : stage.name === state.current ? "running" : "";
      const mark = document.createElement("span");
      mark.className = "mark";
      const title = document.createElement("span");
      title.textContent = finished && finished.skipped ? `${stage.title} — already done` : stage.title;
      const time = document.createElement("time");
      time.textContent = finished ? elapsed(finished.elapsedMs) : "";
      row.append(mark, title, time);
      return row;
    }));
    const log = document.getElementById("log");
    log.textContent = state.log.join("\n");
    log.scrollTop = log.scrollHeight;
  }

  function apply(event) {
    if (event.name === "stages") state.stages = event.stages;
    if (event.name === "stage-started") state.current = event.stage;
    if (event.name === "stage-finished") { state.finished.set(event.stage, event); state.current = null; }
    if (event.name === "log") { state.log.push(event.line); if (state.log.length > LOG_LINES) state.log.splice(0, state.log.length - LOG_LINES); }
    render();
  }

  let live = false;
  const pending = [];
  document.getElementById("cancel").addEventListener("click", () => {
    document.getElementById("cancel").disabled = true;
    window.suplexDesktop?.cancel?.();
  });
  if (new URLSearchParams(location.search).has("demo")) {
    state.stages = [
      { name: "check", title: "Check this Mac" },
      { name: "xcode", title: "Install Apple developer tools (git)" },
      { name: "herdr", title: "Install Herdr terminals" },
      { name: "data", title: "Prepare Suplex data" },
      { name: "finish", title: "Finish" },
    ];
    state.finished.set("check", { stage: "check", elapsedMs: 400 });
    state.finished.set("xcode", { stage: "xcode", elapsedMs: 1200, skipped: true });
    state.finished.set("herdr", { stage: "herdr", elapsedMs: 300, skipped: true });
    state.current = "data";
    state.log = ["[demo] preparing Suplex data…"];
    render();
  } else if (window.suplexDesktop) {
    window.suplexDesktop.on((event) => { if (live) apply(event); else pending.push(event); });
    window.suplexDesktop.snapshot().then((snapshot) => {
      state.stages = snapshot.stages;
      state.current = snapshot.current;
      state.log = snapshot.log.slice(-LOG_LINES);
      for (const entry of snapshot.finished) state.finished.set(entry.stage, entry);
      live = true;
      for (const event of pending) apply(event);
      render();
    });
  } else {
    render();
  }
  // Browser preview only: Electron always provides window.suplexDesktop, so this stays hidden in the installer.
  if (!window.suplexDesktop) {
    const toggle = document.getElementById("demo-toggle");
    const link = toggle.querySelector("a");
    const showing = new URLSearchParams(location.search).has("demo");
    link.href = showing ? location.pathname : "?demo";
    link.textContent = showing ? "Hide demo steps" : "Show demo steps";
    toggle.hidden = false;
  }
</script>
</body>
</html>
