name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      runner:
        description: Blacksmith runner for timing comparisons
        type: choice
        default: blacksmith-8vcpu-ubuntu-2404
        options:
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-8vcpu-ubuntu-2404
          - blacksmith-16vcpu-ubuntu-2404
      workers:
        description: Vitest workers for timing comparisons
        type: choice
        default: '8'
        options: ['4', '6', '8', '16']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner }}-${{ inputs.workers }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust fmt, clippy, and tests
    env:
      TARGET_CACHE_MAX_KIB: 12582912
      TARGET_CACHE_MAX_SIZE: 12GB
    runs-on: ${{ inputs.runner || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
      - name: Install native lifecycle test dependencies
        run: command -v lsof || { sudo apt-get update && sudo apt-get install --yes --no-install-recommends lsof; }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      # Sticky disks keep the whole target directory, including the suplex
      # crate, and persist even when a step fails. A failed mount builds cold.
      - name: Mount Cargo registry
        continue-on-error: true
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-registry-${{ runner.arch }}
          path: ~/.cargo/registry
          commit: on-change
      - name: Mount Rust target directory
        id: rust-target
        continue-on-error: true
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-rust-job-target-${{ hashFiles('rust-toolchain.toml') }}-${{ runner.arch }}
          path: ${{ github.workspace }}/target
          commit: on-change
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/rust-route-coverage.ts
      - run: pnpm --filter suplex-web build
      # Name packages explicitly: --workspace would unify features with the Tauri crates and build them here.
      - run: cargo fmt -p suplex -p suplex-bootstrap --check
      - run: cargo clippy -p suplex -p suplex-bootstrap --all-targets -- -D warnings
      # The crates have no doctests, which nextest does not run.
      - run: cargo nextest run -p suplex -p suplex-bootstrap --all-targets --profile ci
      - name: Generated TypeScript contracts are committed
        run: git diff --exit-code -- apps/web/contracts/generated
      - name: Enforce persistent target size limit
        if: ${{ always() && steps.rust-target.outcome == 'success' }}
        run: |
          target_size_kib="$(du -sk target | cut -f1)"
          echo "Persistent target size: ${target_size_kib} KiB"
          if (( target_size_kib > TARGET_CACHE_MAX_KIB )); then
            cargo install cargo-sweep --version 0.8.0 --locked
            cargo sweep --maxsize "${TARGET_CACHE_MAX_SIZE}" .
          fi

  test:
    name: Test suite
    runs-on: ${{ inputs.runner || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    env:
      CI: "true"
      TEST_WORKERS: ${{ inputs.workers || '8' }}
      SUPLEX_BIN: ${{ github.workspace }}/target/debug/suplex
      TARGET_CACHE_MAX_KIB: 12582912
      TARGET_CACHE_MAX_SIZE: 12GB
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - name: Mount Cargo registry
        continue-on-error: true
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-registry-${{ runner.arch }}
          path: ~/.cargo/registry
          commit: on-change
      # The test server builds with other features than the Rust job, so it keeps its own target disk.
      - name: Mount Rust target directory
        id: rust-target
        continue-on-error: true
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-test-job-target-${{ hashFiles('rust-toolchain.toml') }}-${{ runner.arch }}
          path: ${{ github.workspace }}/target
          commit: on-change

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test host dependencies
        run: |
          command -v zsh && command -v lsof || sudo apt-get install --yes --no-install-recommends zsh lsof || {
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends zsh lsof
          }

      - name: Install dependencies
        id: dependencies
        run: |
          pnpm install --frozen-lockfile
          playwright_version=$(node -p 'require("playwright/package.json").version')
          echo "playwright-version=$playwright_version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache/restore@v5
        with:
          key: playwright-ubuntu-2404-${{ runner.arch }}-${{ steps.dependencies.outputs.playwright-version }}
          path: ~/.cache/ms-playwright

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Save Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.browsers.outputs.cache-primary-key }}
          path: ~/.cache/ms-playwright

      - name: Lint, typecheck and build the native test server
        run: |
          pnpm lint
          pnpm typecheck
          pnpm --filter suplex-web build
          cargo build --manifest-path apps/server/Cargo.toml --bin suplex

      - name: Cross-app tests
        run: pnpm exec vitest run --project unit --maxWorkers "$TEST_WORKERS" --reporter=default --reporter=junit --outputFile=test-results/unit-integration.xml

      - name: Web client tests
        run: pnpm --filter suplex-web test --maxWorkers "$TEST_WORKERS" --reporter=default --reporter=junit --outputFile="$PWD/test-results/web-unit.xml"

      - name: Browser tests
        run: pnpm exec vitest run --config vitest.browser.config.ts --maxWorkers "$TEST_WORKERS" --reporter=default --reporter=junit --outputFile=test-results/browser.xml

      # Each journey has its own server, data directory and browser, so they run
      # side by side. More than about half the vCPUs starves the UI waits.
      - name: Native workflow journeys
        env:
          SUPLEX_DETERMINISTIC_CODEX_RUN: "1"
          JOURNEY_PARALLELISM: "4"
        run: |
          mkdir -p test-results/journeys
          printf '%s\n' competing_plans refine_pull_request independent_review deliver deliver_pr answer restart cancel deliver_claude direct_build |
            xargs -P "$JOURNEY_PARALLELISM" -I{} sh -c 'SUPLEX_DETERMINISTIC_PHASE={} pnpm exec tsx tests/interop/real-codex-standard.ts > test-results/journeys/{}.log 2>&1 && echo "passed {}" || { echo "failed {}"; exit 1; }' ||
            { for log in test-results/journeys/*.log; do echo "::group::$log"; cat "$log"; echo "::endgroup::"; done; exit 1; }
          grep -h '^\[journey ' test-results/journeys/*.log

      - name: Enforce persistent target size limit
        if: ${{ always() && steps.rust-target.outcome == 'success' }}
        run: |
          target_size_kib="$(du -sk target | cut -f1)"
          echo "Persistent target size: ${target_size_kib} KiB"
          if (( target_size_kib > TARGET_CACHE_MAX_KIB )); then
            cargo install cargo-sweep --version 0.8.0 --locked
            cargo sweep --maxsize "${TARGET_CACHE_MAX_SIZE}" .
          fi

  desktop-linux:
    name: Desktop shell (Linux)
    # Clippy and tests for the shell on Linux. Packaging runs in Docker in the release (mise run desktop:dist:linux),
    # and Windows checks run in Docker (mise run desktop:check:windows).
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install WebKitGTK and tray build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: clippy
      - name: Cache Cargo registry and dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

  desktop:
    name: Desktop shell (macOS)
    # The Tauri shell, its WKWebView smoke tests, and its packaging run only on macOS. A Linux job is not evidence for them.
    runs-on: blacksmith-6vcpu-macos-latest
    # A cold cache builds the host and shell in release twice (arm64, then x64), about 20 minutes each on this runner.
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Record the runner
        run: sw_vers && uname -m && sysctl -n machdep.cpu.brand_string
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # actions/cache saves only after a successful job, so a failing job rebuilt cold every run.
      - name: Cache Cargo registry and dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --features native-test -- -D warnings
      - name: Shell behavior and IPC authorization tests
        run: pnpm desktop:test
      - name: Build the web client and debug host for the native smoke tests
        run: |
          pnpm --filter suplex-web build
          cargo build --manifest-path apps/server/Cargo.toml --bin suplex
      # Locally the smoke build keeps its own target directory; in CI, sharing the workspace's reuses its compiled dependencies.
      - name: Native WKWebView smoke tests
        env:
          SUPLEX_NATIVE_TARGET_DIR: ${{ github.workspace }}/target
        run: pnpm desktop:test:native
      # Packaging is four release builds (about 40 minutes), so it runs on main and manual runs, not on every PR.
      # A temporary updater key and a test feed exercise both update manifests; production keys stay in the release path.
      - name: Package Apple silicon with test update feeds
        if: github.event_name != 'pull_request'
        run: |
          key="$RUNNER_TEMP/updater-test"
          pnpm --filter suplex-desktop exec tauri signer generate -w "$key" -p "" --ci
          SUPLEX_DESKTOP_ARCH=arm64 \
          SUPLEX_DESKTOP_UPDATE_URL=https://downloads.example.invalid/stable/mac/arm64/ \
          SUPLEX_DESKTOP_UPDATER_PUBKEY="$(cat "$key.pub")" \
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" \
          pnpm desktop:dist
          rm -f "$key" "$key.pub"
      - if: github.event_name != 'pull_request'
        run: SUPLEX_DESKTOP_ARCH=arm64 pnpm desktop:verify:release
      - name: Package Intel
        if: github.event_name != 'pull_request'
        run: SUPLEX_DESKTOP_ARCH=x64 pnpm desktop:dist
      # Inspects the x64 bundle; it does not run Intel code on this runner.
      - if: github.event_name != 'pull_request'
        run: SUPLEX_DESKTOP_ARCH=x64 pnpm test:packaged
