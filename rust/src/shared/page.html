<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <title>{heading} · Suplex</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Geist", system-ui, sans-serif;
        background: #0f0f0f;
        color: oklch(0.985 0 0);
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 48px 24px;
        text-align: center;
        text-wrap: balance;
      }
      h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 400; overflow-wrap: anywhere; }
      p { margin: 0; max-width: 384px; color: oklch(0.708 0 0); font-size: 14px; line-height: 26.16px; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 8px 0 0; }
      .actions a, .actions button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid #383838;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
      }
      .actions input { min-height: 36px; min-width: 0; padding: 0 10px; border: 1px solid #383838; border-radius: 6px; background: transparent; color: inherit; font: inherit; font-size: 14px; }
      p a { color: inherit; }
      .actions a:hover, .actions button:hover { background: #1f1f1f; }
      .actions .primary { border-color: transparent; background: oklch(0.938 0.172 121.709); color: oklch(0.205 0 0); }
      .actions .primary:hover { background: oklch(0.938 0.172 121.709 / 0.8); }
      .actions a:focus-visible, .actions button:focus-visible { outline: 2px solid oklch(0.938 0.172 121.709); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>{heading}</h1>
      {body}
    </main>
  </body>
</html>
