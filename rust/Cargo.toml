[package]
name = "suplex"
version = "0.2.1"
edition = "2024"
rust-version = "1.93.1"

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
garde = { version = "0.22", features = ["derive", "regex"] }
getrandom = "0.4"
libc = "0.2"
nix = { version = "0.31.3", features = ["signal", "process"] }
regex = "1"
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
ryu-js = "1.0.3"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "=0.5.4", features = ["danger-allow-state-serialisation", "danger-credential-internals"] }
