[tools]
node = "26.7.0"
"npm:pnpm" = "11.0.6"

[hooks]
postinstall = "pnpm install --frozen-lockfile"

[settings]
experimental = true

[env]
NODE_ENV = "development"
FORGE_TAILSCALE_ADDRESS = "{{ exec(command='sh scripts/resolve-magicdns.sh') | trim }}"
FORGE_TAILSCALE_EXPOSURE = "serve"
FORGE_BIND_ADDRESS = "127.0.0.1"
_.path = "./node_modules/.bin"

[tasks.setup]
description = "Install pinned tools and dependencies for development"
alias = "worktree"
run = "mise install && pnpm exec playwright install chromium"

[tasks.dev]
description = "Run the Forge supervisor, API, worker host, and Vite HMR"
env = { FORGE_PRETTY_LOGS = "1", FORGE_FRONTEND_DEV_SERVER = "1", FORGE_DEVELOPMENT_AUTO_LOGIN = "1" }
run = '''
export PATH="$(dirname "$(mise which node)"):$PATH"
[ -r "${NODE_EXTRA_CA_CERTS:-}" ] || unset NODE_EXTRA_CA_CERTS
export FORGE_PORT=${CONDUCTOR_PORT:-4111}
exec node src/platform/updates/supervisor.ts
'''

[tasks."dev:watch"]
description = "Run the Forge supervisor with backend reloads"
env = { FORGE_PRETTY_LOGS = "1", FORGE_FRONTEND_DEV_SERVER = "1", FORGE_DEVELOPMENT_AUTO_LOGIN = "1" }
run = '''
export PATH="$(dirname "$(mise which node)"):$PATH"
[ -r "${NODE_EXTRA_CA_CERTS:-}" ] || unset NODE_EXTRA_CA_CERTS
export FORGE_PORT=${CONDUCTOR_PORT:-4111}
exec node src/platform/updates/supervisor.ts --watch
'''

[tasks.down]
description = "Stop this checkout's dev stack"
run = '''
FP=${CONDUCTOR_PORT:-4111}
PIDS=$(lsof -ti:$FP 2>/dev/null | sort -u)
if [ -z "$PIDS" ]; then echo "nothing listening on $FP"; exit 0; fi
for p in $PIDS; do g=$(ps -o pgid= -p "$p" | tr -d ' '); [ -n "$g" ] && kill -TERM -"$g" 2>/dev/null; done
echo "sent SIGTERM to dev stack"
'''

[tasks."dev:status"]
run = '''
FP=${CONDUCTOR_PORT:-4111}
lsof -nP -iTCP:$FP -sTCP:LISTEN || echo "dev stack not running (port $FP free)"
'''

[tasks."dev:recover"]
run = '''
FP=${CONDUCTOR_PORT:-4111}
PIDS=$(lsof -ti:$FP 2>/dev/null | sort -u)
if [ -z "$PIDS" ]; then echo "nothing listening on $FP"; exit 0; fi
for p in $PIDS; do g=$(ps -o pgid= -p "$p" | tr -d ' '); [ -n "$g" ] && kill -KILL -"$g" 2>/dev/null; done
echo "force-killed dev stack"
'''

[tasks."db:migrate"]
run = "mise exec -- node --import tsx src/cli.ts migrate"
[tasks.build]
run = "export PATH=\"$(dirname \"$(mise which node)\"):$PATH\" && pnpm run build"
[tasks.typecheck]
run = "export PATH=\"$(dirname \"$(mise which node)\"):$PATH\" && pnpm run typecheck"
[tasks.test]
run = "export PATH=\"$(dirname \"$(mise which node)\"):$PATH\" && pnpm run test"
[tasks.test-browser]
run = "export PATH=\"$(dirname \"$(mise which node)\"):$PATH\" && pnpm run test:browser"

[tasks."desktop:dev"]
description = "Build the desktop app and open it with Electron"
run = "pnpm run desktop:dev"
[tasks."desktop:build"]
description = "Compile the desktop app"
run = "pnpm run desktop:build"
[tasks."desktop:typecheck"]
run = "pnpm run desktop:typecheck"
[tasks."desktop:test"]
run = "pnpm run desktop:test"
[tasks."desktop:dist"]
description = "Bundle the server runtime, then package the arm64 Forge.app, DMG, and ZIP under desktop/release (Developer ID signed if the cert is in the keychain, not notarized)"
run = "pnpm run desktop:dist"
[tasks."desktop:dist:signed"]
description = "Bundle the server runtime, then package, sign, notarize, and staple the arm64 DMG for distribution; Apple credentials come from the 1Password Forge vault (.env.production)"
run = '''
if [ -z "${OP_SERVICE_ACCOUNT_TOKEN:-}" ]; then
  f="$HOME/.config/forge/op-service-account-token"
  [ -r "$f" ] || { echo "Set OP_SERVICE_ACCOUNT_TOKEN or save the 1Password service account token to $f" >&2; exit 1; }
  export OP_SERVICE_ACCOUNT_TOKEN="$(cat "$f")"
fi
pnpm run desktop:dist:signed
shasum -a 256 desktop/release/Forge-*-arm64.dmg
'''
[tasks."desktop:open"]
description = "Open the installed Forge.app at this checkout's dev stack (http://localhost:<port>)"
run = '''
export PATH="$(dirname "$(mise which node)"):$PATH"
export FORGE_PORT=${CONDUCTOR_PORT:-4111}
exec tsx src/cli.ts desktop
'''
