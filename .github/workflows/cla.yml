name: CLA

# Records Contributor License Agreement acceptance on the cla-signatures branch.
# pull_request_target runs this file from main and never checks out pull request code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor License Agreement
    if: >-
      github.repository == 'meiji-industries/suplex' && (
        github.event_name == 'pull_request_target' ||
        github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
      )
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/meiji-industries/suplex/blob/main/CLA.md
          branch: cla-signatures
          allowlist: adammeghji,mari-meiji,*[bot]
