[tools]
node = "26.7.0"
"npm:pnpm" = "11.0.6"

[hooks]
postinstall = "pnpm install --frozen-lockfile"

[settings]
experimental = true

[env]
NODE_ENV = "development"
FORGE_TAILSCALE_ADDRESS = "{{ exec(command='sh scripts/resolve-magicdns.sh') | trim }}"
FORGE_TAILSCALE_EXPOSURE = "serve"
FORGE_BIND_ADDRESS = "127.0.0.1"
_.path = "./node_modules/.bin"

[tasks.setup]
description = "Install pinned tools and dependencies for development"
alias = "worktree"
run = "mise install && pnpm exec playwright install chromium"

[tasks.dev]
description = "Run the Forge API, worker host, and Vite HMR in one process"
env = { FORGE_PRETTY_LOGS = "1", FORGE_FRONTEND_DEV_SERVER = "1", FORGE_DEVELOPMENT_AUTO_LOGIN = "1" }
run = '''
export PATH="$(dirname "$(mise which node)"):$PATH"
[ -r "${NODE_EXTRA_CA_CERTS:-}" ] || unset NODE_EXTRA_CA_CERTS
export FORGE_PORT=${CONDUCTOR_PORT:-4111}
exec tsx src/server.ts
'''

[tasks."dev:watch"]
description = "Run the single-process stack with backend reloads"
env = { FORGE_PRETTY_LOGS = "1", FORGE_FRONTEND_DEV_SERVER = "1", FORGE_DEVELOPMENT_AUTO_LOGIN = "1" }
run = '''
export PATH="$(dirname "$(mise which node)"):$PATH"
[ -r "${NODE_EXTRA_CA_CERTS:-}" ] || unset NODE_EXTRA_CA_CERTS
export FORGE_PORT=${CONDUCTOR_PORT:-4111}
exec tsx watch --clear-screen=false --exclude './src/frontend/**' src/server.ts
'''

[tasks.worker]
description = "Run the engine host without HTTP"
run = '''
export PATH="$(dirname "$(mise which node)"):$PATH"
[ -r "${NODE_EXTRA_CA_CERTS:-}" ] || unset NODE_EXTRA_CA_CERTS
export FORGE_PORT=${CONDUCTOR_PORT:-4111}
exec tsx src/engine/host.ts
'''

[tasks."dev:idle"]
description = "Exit 0 when no engine activities are in flight"
run = '''
db=${FORGE_DATABASE_PATH:-.forge/data/forge.sqlite}
port=${CONDUCTOR_PORT:-4111}
cutoff=$(date -u -v-2M +%Y-%m-%dT%H:%M:%SZ)
listening=$(lsof -ti:"$port" -sTCP:LISTEN 2>/dev/null || true)
if [ -z "$listening" ]; then
  stale=$(sqlite3 "$db" "select workflow_id||': '||activity from forge_engine_activities where heartbeat_at < '$cutoff'" 2>/dev/null || true)
  if [ -n "$stale" ]; then
    echo "STALE — removing activities from a stopped stack:"
    echo "$stale"
    sqlite3 "$db" "delete from forge_engine_activities where heartbeat_at < '$cutoff'"
  fi
fi
busy=$(sqlite3 "$db" "select workflow_id||': '||activity from forge_engine_activities" 2>/dev/null || true)
if [ -n "$busy" ]; then echo "BUSY — activities in flight:"; echo "$busy"; exit 1; fi
echo "IDLE — safe to restart"
'''

[tasks.down]
description = "Stop this checkout's dev stack"
run = '''
FP=${CONDUCTOR_PORT:-4111}
PIDS=$(lsof -ti:$FP 2>/dev/null | sort -u)
if [ -z "$PIDS" ]; then echo "nothing listening on $FP"; exit 0; fi
for p in $PIDS; do g=$(ps -o pgid= -p "$p" | tr -d ' '); [ -n "$g" ] && kill -TERM -"$g" 2>/dev/null; done
echo "sent SIGTERM to dev stack"
'''

[tasks."dev:status"]
run = '''
FP=${CONDUCTOR_PORT:-4111}
lsof -nP -iTCP:$FP -sTCP:LISTEN || echo "dev stack not running (port $FP free)"
'''

[tasks."dev:recover"]
run = '''
FP=${CONDUCTOR_PORT:-4111}
PIDS=$(lsof -ti:$FP 2>/dev/null | sort -u)
if [ -z "$PIDS" ]; then echo "nothing listening on $FP"; exit 0; fi
for p in $PIDS; do g=$(ps -o pgid= -p "$p" | tr -d ' '); [ -n "$g" ] && kill -KILL -"$g" 2>/dev/null; done
echo "force-killed dev stack"
'''

[tasks."db:migrate"]
run = "mise exec -- node --import tsx src/cli.ts migrate"
[tasks.build]
run = "pnpm run build"
[tasks.typecheck]
run = "pnpm run typecheck"
[tasks.test]
run = "pnpm run test"
[tasks.test-engine]
run = "pnpm run test:engine"
[tasks.test-browser]
run = "pnpm run test:browser"
