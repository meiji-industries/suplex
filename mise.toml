[tools]
node = "26.7.0"
"npm:pnpm" = "11.0.6"

[hooks]
postinstall = "pnpm install --frozen-lockfile"

[settings]
experimental = true
activate_aggressive = true

[env]
NODE_ENV = "development"
SUPLEX_TAILSCALE_ADDRESS = "{{ exec(command='sh scripts/resolve-magicdns.sh') | trim }}"
SUPLEX_TAILSCALE_EXPOSURE = "serve"
SUPLEX_BIND_ADDRESS = "127.0.0.1"
_.path = "./node_modules/.bin"

[tasks.setup]
description = "Install pinned tools and dependencies for development"
alias = "worktree"
run = "mise install && pnpm exec playwright install chromium"

[tasks.dev]
description = "Run the Suplex supervisor, API, worker host, and Vite HMR"
env = { SUPLEX_PRETTY_LOGS = "1", SUPLEX_FRONTEND_DEV_SERVER = "1", SUPLEX_DEVELOPMENT_AUTO_LOGIN = "1" }
run = '''
export PATH="$(dirname "$(mise which node)"):$PATH"
[ -r "${NODE_EXTRA_CA_CERTS:-}" ] || unset NODE_EXTRA_CA_CERTS
export SUPLEX_PORT=${CONDUCTOR_PORT:-4111}
exec node src/platform/updates/supervisor.ts
'''

[tasks."dev:watch"]
description = "Run the Suplex supervisor with backend reloads"
env = { SUPLEX_PRETTY_LOGS = "1", SUPLEX_FRONTEND_DEV_SERVER = "1", SUPLEX_DEVELOPMENT_AUTO_LOGIN = "1" }
run = '''
export PATH="$(dirname "$(mise which node)"):$PATH"
[ -r "${NODE_EXTRA_CA_CERTS:-}" ] || unset NODE_EXTRA_CA_CERTS
export SUPLEX_PORT=${CONDUCTOR_PORT:-4111}
exec node src/platform/updates/supervisor.ts --watch
'''

[tasks."dev:rust"]
description = "Build the frontend and run the isolated experimental Rust backend"
run = '''
pnpm exec vite build
export SUPLEX_RUST_ASSETS_DIR="$PWD/dist/web"
export SUPLEX_RUST_ROOT="$PWD/.suplex-rust"
cd rust
unset RUSTUP_TOOLCHAIN
exec cargo run --bin suplex
'''

[tasks."build:rust"]
description = "Build the experimental Rust binary with frontend assets and migrations"
run = '''
pnpm exec vite build
cd rust
unset RUSTUP_TOOLCHAIN
cargo build --release --bin suplex
'''

[tasks."test:rust"]
run = '''
cd rust
unset RUSTUP_TOOLCHAIN
cargo test
'''

[tasks."test:parity"]
run = '''
pnpm exec tsx scripts/rust-route-coverage.ts
pnpm exec tsx tests/parity/generate.ts
pnpm exec tsx tests/parity/hash-bytes/generate.ts
cd rust
unset RUSTUP_TOOLCHAIN
cargo test --test contract_parity --test hash_bytes --test project_dependency_parity
cargo test --lib signed_fresh_passkey_survives_reopen_and_updates_counter -- --ignored --nocapture
cargo test --lib signed_fresh_passkey_over_isolated_tcp_listener -- --ignored --nocapture
'''

[tasks."test:journey:rust"]
description = "Run the deterministic Codex and Claude Code browser journeys against the Rust backend"
run = '''
set -e
[ -f dist/web/suplex-ui.js ] || pnpm exec vite build
(cd rust && unset RUSTUP_TOOLCHAIN && cargo build --bin suplex --features github-test-endpoint)
export SUPLEX_RUST_BIN="${CARGO_TARGET_DIR:-$PWD/rust/target}/debug/suplex"
export SUPLEX_BROWSER_BACKEND=rust SUPLEX_DETERMINISTIC_CODEX_RUN=1
for phase in deliver deliver_pr answer restart cancel deliver_claude; do
  SUPLEX_DETERMINISTIC_PHASE=$phase pnpm exec tsx tests/interop/real-codex-standard.ts
done
'''

[tasks."test:interop:rust"]
description = "Run the Rust interop scripts other than the Codex journey"
run = '''
set -e
[ -f dist/web/suplex-ui.js ] || pnpm exec vite build
(cd rust && unset RUSTUP_TOOLCHAIN && cargo build --bin suplex --features github-test-endpoint)
export SUPLEX_RUST_BIN="${CARGO_TARGET_DIR:-$PWD/rust/target}/debug/suplex"
export SUPLEX_BROWSER_BACKEND=rust
for script in root-delivery-inspection root-image root-worker-evidence root-worker-replacement task-timeline; do
  echo "[interop] $script" >&2
  pnpm exec tsx --import ./tests/helpers/interop-deadline.ts tests/interop/$script.ts
done
'''

[tasks.down]
description = "Stop this checkout's dev stack"
run = '''
FP=${CONDUCTOR_PORT:-4111}
PIDS=$(lsof -ti:$FP 2>/dev/null | sort -u)
if [ -z "$PIDS" ]; then echo "nothing listening on $FP"; exit 0; fi
for p in $PIDS; do g=$(ps -o pgid= -p "$p" | tr -d ' '); [ -n "$g" ] && kill -TERM -"$g" 2>/dev/null; done
echo "sent SIGTERM to dev stack"
'''

[tasks."dev:status"]
run = '''
FP=${CONDUCTOR_PORT:-4111}
lsof -nP -iTCP:$FP -sTCP:LISTEN || echo "dev stack not running (port $FP free)"
'''

[tasks."dev:recover"]
run = '''
FP=${CONDUCTOR_PORT:-4111}
PIDS=$(lsof -ti:$FP 2>/dev/null | sort -u)
if [ -z "$PIDS" ]; then echo "nothing listening on $FP"; exit 0; fi
for p in $PIDS; do g=$(ps -o pgid= -p "$p" | tr -d ' '); [ -n "$g" ] && kill -KILL -"$g" 2>/dev/null; done
echo "force-killed dev stack"
'''

[tasks."db:migrate"]
run = "mise exec -- node --import tsx src/cli.ts migrate"
[tasks.build]
run = "export PATH=\"$(dirname \"$(mise which node)\"):$PATH\" && pnpm run build"
[tasks.typecheck]
run = "export PATH=\"$(dirname \"$(mise which node)\"):$PATH\" && pnpm run typecheck"
[tasks.test]
run = "export PATH=\"$(dirname \"$(mise which node)\"):$PATH\" && pnpm run test"
[tasks.test-browser]
run = "export PATH=\"$(dirname \"$(mise which node)\"):$PATH\" && pnpm run test:browser"

[tasks."desktop:dev"]
description = "Build the desktop app and open it with Electron"
run = "pnpm run desktop:dev"
[tasks."desktop:build"]
description = "Compile the desktop app"
run = "pnpm run desktop:build"
[tasks."desktop:typecheck"]
run = "pnpm run desktop:typecheck"
[tasks."desktop:test"]
run = "pnpm run desktop:test"
[tasks."desktop:dist"]
description = "Bundle the server runtime, then package Suplex.app, DMG, and ZIP under desktop/release/<arch> (SUPLEX_DESKTOP_ARCH=arm64 or x64, default arm64; Developer ID signed if the cert is in the keychain, not notarized)"
run = "pnpm run desktop:dist"
[tasks."desktop:dist:signed"]
description = "Bundle the server runtime, then package, sign, notarize, and staple the Apple silicon and Intel DMGs for distribution; Apple credentials come from the 1Password Suplex vault (.env.production)"
run = '''
source scripts/onepassword.sh
onepassword_setup_service_account
for arch in arm64 x64; do
  SUPLEX_DESKTOP_ARCH=$arch pnpm run desktop:dist:signed
done
shasum -a 256 desktop/release/*/Suplex-*.dmg
'''
[tasks."_1password:setup"]
hide = true
description = "Fetch or verify the Suplex 1Password service account"
run = '''
source scripts/onepassword.sh
onepassword_setup_service_account
'''
[tasks."desktop:publish"]
description = "Publish the signed desktop release with R2 credentials from 1Password"
run = '''
source scripts/onepassword.sh
onepassword_setup_service_account
for arch in arm64 x64; do
  SUPLEX_DESKTOP_ARCH=$arch op run --env-file desktop/release.env -- pnpm run desktop:publish
done
'''
[tasks."_release:bump"]
hide = true
run = '''
node --input-type=module <<'NODE'
import { readFile, writeFile } from "node:fs/promises";

const files = ["package.json", "desktop/package.json"];
const packages = await Promise.all(files.map(async (file) => ({ file, value: JSON.parse(await readFile(file, "utf8")) })));
const current = packages[0].value.version;
if (!packages.every(({ value }) => value.version === current)) throw new Error("Desktop and runtime versions must match before release.");
const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(current);
if (!match) throw new Error(`Expected a semantic version, got ${current}.`);
const [major, minor, patch] = match.slice(1).map(Number);
const next = process.env.RELEASE_BUMP === "major" ? `${major + 1}.0.0`
  : process.env.RELEASE_BUMP === "minor" ? `${major}.${minor + 1}.0`
  : process.env.RELEASE_BUMP === "patch" ? `${major}.${minor}.${patch + 1}`
  : (() => { throw new Error("RELEASE_BUMP must be major, minor, or patch."); })();
await Promise.all(packages.map(({ file, value }) => writeFile(file, `${JSON.stringify({ ...value, version: next }, null, 2)}\n`)));
console.log(`${current} -> ${next}`);
NODE
'''
[tasks."_release:check"]
hide = true
description = "Verify the checkout is ready for a desktop release"
run = '''
git --no-pager diff --check
[[ -z "$(git status --porcelain)" ]] || { echo "Commit or remove working-tree changes before releasing." >&2; exit 1; }
root_version="$(node -p "require('./package.json').version")"
desktop_version="$(node -p "require('./desktop/package.json').version")"
[[ "$root_version" == "$desktop_version" ]] || { echo "Desktop and runtime versions must match before release." >&2; exit 1; }
'''
[tasks."_release:commit"]
hide = true
description = "Commit, tag, and push the released desktop version"
run = '''
version="$(node -p "require('./package.json').version")"
git add package.json desktop/package.json
git commit -m "release: v$version"
git tag "v$version"
git push
git push origin "v$version"
'''
[tasks."_release:run"]
hide = true
description = "Run the desktop release pipeline"
run = "mise run _release:check && mise run _1password:setup && mise run _release:bump && mise run desktop:dist:signed && mise run _release:commit && mise run desktop:publish"
[tasks."release:major"]
description = "Bump, sign, notarize, commit, tag, push, and publish the next major desktop release"
run = "RELEASE_BUMP=major mise run _release:run"
[tasks."release:minor"]
description = "Bump, sign, notarize, commit, tag, push, and publish the next minor desktop release"
run = "RELEASE_BUMP=minor mise run _release:run"
[tasks."release:patch"]
description = "Bump, sign, notarize, commit, tag, push, and publish the next patch desktop release"
run = "RELEASE_BUMP=patch mise run _release:run"
[tasks."desktop:open"]
description = "Open the installed Suplex.app at this checkout's dev stack (http://localhost:<port>)"
run = '''
export PATH="$(dirname "$(mise which node)"):$PATH"
export SUPLEX_PORT=${CONDUCTOR_PORT:-4111}
exec tsx src/cli.ts desktop
'''
[tasks."desktop:pages"]
description = "Serve the desktop setup pages for browser preview"
run = '''
echo "Preview: http://localhost:8123/install.html and http://localhost:8123/choice.html"
exec python3 -m http.server 8123 --directory desktop/src/pages
'''
