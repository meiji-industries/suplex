[tools]
node = "26.7.0"
"npm:pnpm" = "11.0.6"

[env]
NODE_ENV = "development"
FORGE_TAILSCALE_ADDRESS = "pro2.tail1234.ts.net"
_.path = "./node_modules/.bin"

[tasks.dev]
description = "Run Temporal, Forge, and the frontend watcher in the foreground"
depends = "build"
run = [{ tasks = ["temporal", "server", "watch"] }]

[tasks.temporal]
description = "Run the pinned Temporal development service through Compose"
run = "pnpm run docker:up"

[tasks."docker:up"]
description = "Start the Compose-managed Temporal development service"
run = "pnpm exec tsx scripts/compose-temporal.ts up"

[tasks."docker:down"]
description = "Stop and remove the Compose-managed Temporal development service"
run = "pnpm exec tsx scripts/compose-temporal.ts down"

[tasks.server]
description = "Start the Forge server in the foreground"
run = "FORGE_TEMPORAL_MODE=external pnpm run dev"

[tasks.watch]
description = "Rebuild the frontend when source files change"
run = "pnpm exec vite build --watch"

[tasks.vite]
description = "Start the Vite dev server"
run = "pnpm exec vite"

[tasks.build]
description = "Compile TypeScript and build with Vite"
run = "pnpm run build"

[tasks.typecheck]
description = "Type-check the project without emitting"
run = "pnpm run typecheck"

[tasks.test]
description = "Run unit and integration tests (excludes Temporal and browser tests)"
run = "pnpm run test"

[tasks.test-temporal]
description = "Run Temporal integration tests"
run = "pnpm run test:temporal"

[tasks.test-browser]
description = "Build and run Playwright browser tests"
run = "pnpm run test:browser"

[tasks.test-all]
description = "Run typecheck, unit, Temporal, and browser tests"
run = "pnpm run test:all"
