[workspace]
resolver = "3"
members = ["apps/server", "apps/desktop/src-tauri", "apps/mobile/src-tauri", "apps/bootstrap", "packages/suplex-exception"]
default-members = ["apps/server"]

[workspace.package]
license = "Elastic-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"

[profile.dev]
debug = "line-tables-only"
# Keep local edit/rebuild cycles incremental; the wrapper caches eligible dependencies.
incremental = true

# Third-party crates do not need DWARF debug info in dev/test builds: workspace
# crates still keep line tables for panic/backtrace locations, while skipping
# dependency debug info shrinks .rlib/.o artifacts, binary __LINKEDIT, and link
# times across worktrees and CI caches.
[profile.dev.package."*"]
debug = 0

# Unoptimized SQLite made each test's migrated database cost about one second.
# Package-specific overrides inherit from [profile.dev], not package."*", so
# repeat debug = 0 explicitly.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
debug = 0

# Xcode 27 hides swift-rs's runtime exports, so the iOS link fails (Brendonovich/swift-rs#81).
# Pinned to the fix in Brendonovich/swift-rs#82; drop this once a swift-rs release includes it.
[patch.crates-io]
swift-rs = { git = "https://github.com/Brendonovich/swift-rs", rev = "3788d3d2bae8e7a863b3e281a59477438e12c632" }
