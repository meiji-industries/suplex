[package]
name = "suplex-desktop"
version = "1.6.1"
edition = "2021"
publish = false
rust-version = "1.93"

[lib]
name = "suplex_desktop"
path = "src/lib.rs"

[[bin]]
name = "suplex-desktop"
path = "src/main.rs"

[features]
# Records native effects (external opens, Finder reveals, quits) and IPC outcomes for
# the native smoke suite instead of performing them. Never enabled in release builds.
native-test = []

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "=2.5.2", features = ["deep-link"] }
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-updater = "=2.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "fs", "io-util", "macros", "rt-multi-thread", "sync", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Windows and Linux only: macOS posts notifications through UNUserNotificationCenter and copies with pbcopy.
tauri-plugin-notification = "=2.5.1"
tauri-plugin-clipboard-manager = "=2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationTrigger"] }

[dev-dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png", "test"] }
tempfile = "3"
# The versions tauri-plugin-updater uses: tests/updater_signature.rs verifies as the updater does.
minisign-verify = "0.2.5"
base64 = "0.22.1"
