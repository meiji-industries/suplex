[package]
name = "suplex"
version = "0.2.1"
edition = "2024"
rust-version = "1.93.1"

[features]
github-test-endpoint = []

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = "0.4"
garde = { version = "0.22", features = ["derive", "regex"] }
getrandom = "0.4"
git2 = { version = "0.21", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
libc = "0.2"
nix = { version = "0.31.3", features = ["signal", "process"] }
regex = "1"
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
ryu-js = "1.0.3"
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "=0.5.4", features = ["danger-allow-state-serialisation", "danger-credential-internals"] }
octocrab = { version = "0.54.2", default-features = false, features = ["default-client", "follow-redirect", "jwt-rust-crypto", "rustls", "rustls-ring", "timeout", "tracing"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1", "apple-native-keyring-store"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework-sys = "2.17"
