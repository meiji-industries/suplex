name: Mobile shell

# The release task pushes the v* tag after it bumps every version file, so this checks the
# iOS and Android shell crate once per release instead of on every pull request.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile shell crate (macOS)
    # The crate builds for the host and for iOS here. Simulator runs and Android builds need SDKs this runner lacks.
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
          targets: aarch64-apple-ios
      - name: Cache Cargo registry and dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri -> target
          cache-on-failure: true
      - run: cargo fmt --manifest-path mobile/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path mobile/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path mobile/src-tauri/Cargo.toml --lib --target aarch64-apple-ios -- -D warnings
      - name: Host and navigation policy tests
        run: cargo test --manifest-path mobile/src-tauri/Cargo.toml
