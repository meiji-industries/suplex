[package]
name = "suplex"
version = "0.2.1"
edition = "2024"
rust-version = "1.93.1"

[dependencies]
axum = "0.8"
base64 = "0.22"
openssl = "0.10"
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_cbor_2 = "0.13"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
url = "2"
webauthn-rs-core = "=0.5.4"
