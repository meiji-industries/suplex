<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge is ready</title>
<link rel="stylesheet" href="pages.css">
</head>
<body>
<main>
  <h1>Forge is ready</h1>
  <div class="actions"><button class="primary" id="launch" type="button" autofocus>Launch</button></div>
</main>
<script>
  document.getElementById("launch").addEventListener("click", () => {
    document.getElementById("launch").disabled = true;
    window.forgeDesktop.launch();
  });
</script>
</body>
</html>
