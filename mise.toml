[tools]
node = "26.7.0"
"npm:pnpm" = "11.0.6"
"github:temporalio/cli" = "1.8.2"

[env]
NODE_ENV = "development"
FORGE_TAILSCALE_ADDRESS = "pro2.tail1234.ts.net"
_.path = "./node_modules/.bin"

[tasks.dev]
description = "Run Forge with a local Temporal dev server and frontend watcher"
depends = "build"
run = [{ tasks = ["temporal", "server", "watch"] }]

[tasks.temporal]
description = "Start the local Temporal development server"
run = "mkdir -p .forge/dev && exec temporal server start-dev --db-filename .forge/dev/temporal.db --namespace forge-dev --search-attribute CompanyId=Keyword --search-attribute ProjectId=Keyword --search-attribute IssueId=Keyword"

[tasks.server]
description = "Start the Forge server in the foreground"
run = "pnpm run dev"

[tasks.server.env]
FORGE_TEMPORAL_TARGET = "local"
FORGE_TEMPORAL_ADDRESS = "127.0.0.1:7233"
FORGE_TEMPORAL_NAMESPACE = "forge-dev"

[tasks.watch]
description = "Rebuild the frontend when source files change"
run = "pnpm exec vite build --watch"

[tasks.vite]
description = "Start the Vite dev server"
run = "pnpm exec vite"

[tasks.build]
description = "Compile TypeScript and build with Vite"
run = "pnpm run build"

[tasks.typecheck]
description = "Type-check the project without emitting"
run = "pnpm run typecheck"

[tasks.test]
description = "Run unit and integration tests (excludes Temporal and browser tests)"
run = "pnpm run test"

[tasks.test-temporal]
description = "Run Temporal integration tests"
run = "pnpm run test:temporal"

[tasks.test-browser]
description = "Build and run Playwright browser tests"
run = "pnpm run test:browser"

[tasks.test-all]
description = "Run typecheck, unit, Temporal, and browser tests"
run = "pnpm run test:all"
