[package]
name = "suplex-mobile"
version = "1.5.0"
edition = "2021"
publish = false
rust-version = "1.93"

[lib]
name = "suplex_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "suplex-mobile"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-opener = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# Xcode 27 hides swift-rs's runtime exports, so the iOS link fails (Brendonovich/swift-rs#81).
# Pinned to the fix in Brendonovich/swift-rs#82; drop this once a swift-rs release includes it.
[patch.crates-io]
swift-rs = { git = "https://github.com/Brendonovich/swift-rs", rev = "3788d3d2bae8e7a863b3e281a59477438e12c632" }
