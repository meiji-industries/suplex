name: Sync skills

# Publishes skills/ to the public meiji-industries/suplex-skills repository,
# which `npx skills add` installs from.
on:
  push:
    branches: [main]
    paths: ['skills/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync skills to suplex-skills
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: meiji-industries/suplex-skills
          ssh-key: ${{ secrets.SUPLEX_SKILLS_DEPLOY_KEY }}
          path: public
      - name: Copy and push the skills
        run: |
          rsync --archive --delete --exclude __pycache__ skills/ public/skills/
          cd public
          git add --all skills
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --message "Sync skills from suplex"
          git push
