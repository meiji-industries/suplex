[package]
name = "suplex"
version = "1.12.0"
edition = "2024"
rust-version = "1.93.1"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "fs"] }
mime = "0.3"
base64 = { workspace = true }
chrono = "0.4"
garde = { version = "0.22", features = ["derive", "regex"] }
getrandom = "0.4"
git2 = { version = "0.21", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
libc = { workspace = true }
nix = { version = "0.31.3", features = ["signal", "process"] }
pty-process = { version = "0.5.3", features = ["async"] }
regex = "1"
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
serde = { workspace = true }
ryu-js = "1.0.3"
toml = { version = "1", features = ["serde"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { workspace = true }
url = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
octocrab = { version = "0.54.2", default-features = false, features = ["default-client", "follow-redirect", "jwt-rust-crypto", "rustls", "rustls-ring", "timeout", "tracing"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1", "apple-native-keyring-store"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["indexmap-impl", "serde-compat", "no-serde-warnings"] }
indexmap = { version = "2.14.2", features = ["serde"] }
vt100 = "0.16.2"
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust"] }
web-push = { version = "0.11", default-features = false }
suplex-exception = { path = "../../packages/exception-report" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework-sys = "2.17"

[dev-dependencies]
elkrs = "0.1.1"

[lints.clippy]
too_many_arguments = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
explicit_iter_loop = "warn"
redundant_else = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
range_plus_one = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
unnecessary_wraps = "warn"
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
disallowed_types = "allow"
disallowed_macros = "allow"
