services:
  temporal:
    image: ${FORGE_TEMPORAL_IMAGE:?FORGE_TEMPORAL_IMAGE is required}
    user: "0:0"
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --namespace
      - ${FORGE_TEMPORAL_NAMESPACE:?FORGE_TEMPORAL_NAMESPACE is required}
      - --db-filename
      - /data/temporal.db
    ports:
      - "${FORGE_TEMPORAL_PORT:-7233}:7233"
      - "${FORGE_TEMPORAL_UI_PORT:-8233}:8233"
    volumes:
      - temporal-data:/data

volumes:
  temporal-data:
    name: ${FORGE_TEMPORAL_VOLUME_NAME:?FORGE_TEMPORAL_VOLUME_NAME is required}
