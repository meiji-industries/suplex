[tools]
node = "26.7.0"
"npm:pnpm" = "11.0.6"
"github:temporalio/cli" = "1.8.2"

[hooks]
postinstall = "pnpm install --frozen-lockfile"

[settings]
experimental = true

[env]
NODE_ENV = "development"
FORGE_TAILSCALE_ADDRESS = "{{ exec(command='sh scripts/resolve-magicdns.sh') | trim }}"
FORGE_TAILSCALE_EXPOSURE = "serve"
FORGE_BIND_ADDRESS = "127.0.0.1"
_.path = "./node_modules/.bin"

[tasks.dev]
description = "Run Temporal, the Forge API, and the worker; tsx watch restarts backend on change"
run = [{ tasks = ["temporal", "server", "worker"] }]

[tasks.down]
description = "Stop this checkout's dev stack (prefer Ctrl-C in the dev terminal)"
run = '''
FP=${CONDUCTOR_PORT:-4111}
TP=${CONDUCTOR_PORT:+$((CONDUCTOR_PORT+1))}; TP=${TP:-7233}
UI=${CONDUCTOR_PORT:+$((CONDUCTOR_PORT+2))}; UI=${UI:-8233}
PIDS=$(lsof -ti:$FP,$TP,$UI 2>/dev/null | sort -u)
if [ -z "$PIDS" ]; then echo "nothing listening on $FP/$TP/$UI"; exit 0; fi
for p in $PIDS; do g=$(ps -o pgid= -p "$p" | tr -d ' '); [ -n "$g" ] && kill -TERM -"$g" 2>/dev/null; done
echo "sent SIGTERM to dev stack"
'''

[tasks."dev:status"]
description = "Show what is listening on this checkout's dev ports"
run = '''
FP=${CONDUCTOR_PORT:-4111}
TP=${CONDUCTOR_PORT:+$((CONDUCTOR_PORT+1))}; TP=${TP:-7233}
UI=${CONDUCTOR_PORT:+$((CONDUCTOR_PORT+2))}; UI=${UI:-8233}
lsof -nP -iTCP:$FP -iTCP:$TP -iTCP:$UI -sTCP:LISTEN || echo "dev stack not running (ports $FP/$TP/$UI free)"
'''

[tasks."dev:restart"]
description = "No-op: tsx watch restarts the API and worker on file save"
run = "echo 'Backend restarts automatically on file change (tsx watch); press Return in the dev terminal to force a rerun.'"

[tasks."dev:recover"]
description = "Force-kill anything still holding this checkout's dev ports"
run = '''
FP=${CONDUCTOR_PORT:-4111}
TP=${CONDUCTOR_PORT:+$((CONDUCTOR_PORT+1))}; TP=${TP:-7233}
UI=${CONDUCTOR_PORT:+$((CONDUCTOR_PORT+2))}; UI=${UI:-8233}
PIDS=$(lsof -ti:$FP,$TP,$UI 2>/dev/null | sort -u)
if [ -z "$PIDS" ]; then echo "nothing listening on $FP/$TP/$UI"; exit 0; fi
for p in $PIDS; do g=$(ps -o pgid= -p "$p" | tr -d ' '); [ -n "$g" ] && kill -KILL -"$g" 2>/dev/null; done
echo "force-killed dev stack"
'''

[tasks.worktree]
description = "Install pinned tools and dependencies for a development worktree"
run = "mise install"

[tasks.temporal]
description = "Start the local Temporal development server"
run = '''
TP=${CONDUCTOR_PORT:+$((CONDUCTOR_PORT+1))}; TP=${TP:-7233}
UI=${CONDUCTOR_PORT:+$((CONDUCTOR_PORT+2))}; UI=${UI:-8233}
mkdir -p .forge/dev
exec temporal server start-dev --port "$TP" --ui-port "$UI" --db-filename .forge/dev/temporal.db --namespace forge-dev --search-attribute CompanyId=Keyword --search-attribute ProjectId=Keyword --search-attribute IssueId=Keyword
'''

[tasks.server]
description = "Forge API under tsx watch (waits for Temporal, embeds Vite HMR)"
run = '''
TP=${CONDUCTOR_PORT:+$((CONDUCTOR_PORT+1))}; TP=${TP:-7233}
until nc -z 127.0.0.1 "$TP" 2>/dev/null; do sleep 0.5; done
export FORGE_PORT=${CONDUCTOR_PORT:-4111}
export FORGE_TEMPORAL_ADDRESS="127.0.0.1:$TP"
exec tsx watch --clear-screen=false --exclude "./src/frontend/**" src/server.ts
'''

[tasks.server.env]
FORGE_TEMPORAL_TARGET = "local"
FORGE_TEMPORAL_NAMESPACE = "forge-dev"
FORGE_FRONTEND_DEV_SERVER = "1"
FORGE_DEVELOPMENT_AUTO_LOGIN = "1"

[tasks.worker]
description = "Forge Temporal worker under tsx watch (waits for Temporal)"
run = '''
TP=${CONDUCTOR_PORT:+$((CONDUCTOR_PORT+1))}; TP=${TP:-7233}
until nc -z 127.0.0.1 "$TP" 2>/dev/null; do sleep 0.5; done
export FORGE_TEMPORAL_ADDRESS="127.0.0.1:$TP"
exec tsx watch --clear-screen=false --exclude "./src/frontend/**" src/worker.ts
'''

[tasks.worker.env]
FORGE_TEMPORAL_TARGET = "local"
FORGE_TEMPORAL_NAMESPACE = "forge-dev"
FORGE_FRONTEND_DEV_SERVER = "1"
FORGE_DEVELOPMENT_AUTO_LOGIN = "1"

[tasks."db:migrate"]
description = "Apply pending SQLite database migrations"
run = "mise exec -- node --import tsx src/cli.ts migrate"

[tasks."db:migrate".env]
FORGE_TEMPORAL_TARGET = "local"
FORGE_TEMPORAL_ADDRESS = "127.0.0.1:7233"
FORGE_TEMPORAL_NAMESPACE = "forge-dev"

[tasks.watch]
description = "Rebuild the frontend when source files change"
run = "pnpm exec vite build --watch"

[tasks.vite]
description = "Start a standalone Vite dev server (normally embedded by mise run dev)"
run = "pnpm exec vite"

[tasks.build]
description = "Compile TypeScript and build with Vite"
run = "pnpm run build"

[tasks.typecheck]
description = "Type-check the project without emitting"
run = "pnpm run typecheck"

[tasks.test]
description = "Run unit and integration tests (excludes Temporal and browser tests)"
run = "pnpm run test"

[tasks.test-temporal]
description = "Run Temporal integration tests"
run = "pnpm run test:temporal"

[tasks.test-browser]
description = "Build and run Playwright browser tests"
run = "pnpm run test:browser"

[tasks.test-governance-real]
description = "Run the mandatory authenticated Ticket 07 governance seam"
run = "pnpm run test:governance-real"

[tasks.verify-ticket-07]
description = "Verify Ticket 07 with the mandatory real Codex seam"
run = "pnpm run verify-ticket-07"

[tasks.test-all]
description = "Run typecheck, unit, Temporal, and browser tests"
run = "pnpm run test:all"

[tasks.test-release-lead]
description = "Run the mandatory authenticated real-Codex Lead/browser release gate"
run = "pnpm run test:release:lead"
