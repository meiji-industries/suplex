<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Suplex could not finish</title>
<link rel="stylesheet" href="pages.css">
<style>
  #reason { margin-top: 8px; color: #fda4af; font-size: 13px; }
  #remedy { margin-top: 8px; }
  .log { margin-top: 20px; }
</style>
</head>
<body data-tauri-drag-region="deep">
<main>
  <h1 id="title">Suplex could not finish</h1>
  <p id="reason"></p>
  <p id="remedy"></p>
  <details class="log" open><summary>Log</summary><pre id="log" data-tauri-drag-region="false"></pre></details>
  <div class="actions">
    <button class="primary" id="retry" type="button">Retry</button>
    <button id="logs" type="button">Open logs</button>
    <button id="copy" type="button">Copy output</button>
  </div>
</main>
<script>
  const on = (id, run) => document.getElementById(id).addEventListener("click", run);
  on("retry", () => { document.getElementById("retry").disabled = true; window.suplexDesktop.retry(); });
  on("logs", () => window.suplexDesktop.openLogs());
  on("copy", () => {
    window.suplexDesktop.copyOutput();
    document.getElementById("copy").textContent = "Copied";
    setTimeout(() => { document.getElementById("copy").textContent = "Copy output"; }, 1500);
  });
  window.suplexDesktop.snapshot().then((snapshot) => {
    const failure = snapshot.failure;
    if (!failure) return;
    document.getElementById("title").textContent = failure.title;
    document.getElementById("reason").textContent = failure.reason;
    document.getElementById("remedy").textContent = failure.remedy ?? "";
    document.getElementById("log").textContent = failure.log.slice(-200).join("\n");
  });
</script>
</body>
</html>
